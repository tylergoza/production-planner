{{define "content"}}
<div class="page-head">
  <div>
    <h1>My account</h1>
    <p class="muted">Signed in as <strong>{{.User.Username}}</strong>{{if .User.IsAdmin}} · Administrator{{end}}</p>
  </div>
</div>
<div class="card narrow">
  <h2>Change password</h2>
  {{template "errors" .Errors}}
  <form method="post" action="/account/password" class="form">
    {{template "csrf" .CSRF}}
    <input type="text" name="username" value="{{.User.Username}}" autocomplete="username" hidden>
    <div class="field">
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <div class="field">
      <label for="password_confirm">Confirm new password</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <button type="submit" class="btn btn--primary">Update password</button>
  </form>
</div>
{{end}}
