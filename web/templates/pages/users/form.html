{{define "content"}}
<nav class="crumbs" aria-label="Breadcrumb"><a href="/admin/users">Users</a></nav>
<div class="page-head"><div><h1>{{.Title}}</h1></div></div>
<div class="card narrow">
  {{template "errors" .Errors}}
  <form method="post" action="{{if .Form.ID}}/admin/users/{{.Form.ID}}{{else}}/admin/users{{end}}" class="form">
    {{template "csrf" .CSRF}}
    {{if not .Form.ID}}
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" value="{{.Form.Username}}" autocapitalize="none" autocomplete="off" required>
      </div>
    {{end}}
    <div class="field">
      <label for="display_name">Display name <span class="optional">optional</span></label>
      <input id="display_name" name="display_name" value="{{.Form.DisplayName}}">
    </div>
    <label class="check">
      <input type="checkbox" name="is_admin" value="1" {{if .Form.IsAdmin}}checked{{end}}>
      Administrator (can manage users, settings and backups)
    </label>
    <fieldset class="fieldset">
      <legend>{{if .Form.ID}}Reset password <span class="optional">leave blank to keep current</span>{{else}}Password{{end}}</legend>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" {{if not .Form.ID}}required{{end}}>
        <p class="hint">At least 10 characters.</p>
      </div>
      <div class="field">
        <label for="password_confirm">Confirm password</label>
        <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" {{if not .Form.ID}}required{{end}}>
      </div>
    </fieldset>
    <div class="form__actions">
      <button type="submit" class="btn btn--primary">Save user</button>
      <a class="btn btn--ghost" href="/admin/users">Cancel</a>
    </div>
  </form>
</div>
{{end}}
